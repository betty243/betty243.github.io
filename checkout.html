<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="container nav">
  <a href="index.html" class="logo"><i class="fa-solid fa-store"></i><span data-site-name>Store</span></a>
  <button class="cart-btn" id="cartBtn" aria-label="Cart"><i class="fa-solid fa-bag-shopping"></i><span id="cartCount">0</span></button>
</div></header>

<div class="container checkout" id="checkoutPage">
  <form class="box" onsubmit="placeOrder(event)">
    <h2 style="margin-bottom:16px">Checkout</h2>
    <div class="error" id="err"></div>
    <h3>Shipping details</h3>
    <div class="f">
      <input required placeholder="Full name">
      <input required type="tel" placeholder="Phone number">
      <input class="full" required type="email" placeholder="Email address">
      <input class="full" required placeholder="Street address">
      <input required placeholder="City">
      <input required placeholder="State">
      <input class="full" required placeholder="PIN code" pattern="[0-9]{6}" title="6 digit PIN code">
    </div>
    <h3 style="margin-top:22px">Payment</h3>
    <div class="f">
      <input class="full" required placeholder="Card number" inputmode="numeric" maxlength="19">
      <input required placeholder="MM / YY" maxlength="7">
      <input required placeholder="CVV" type="password" maxlength="4">
      <input class="full" required placeholder="Name on card">
    </div>
    <button class="btn block" id="payBtn" style="margin-top:20px"><i class="fa-solid fa-lock"></i> Pay Now</button>
  </form>

  <div class="box" style="align-self:start">
    <h3>Order summary</h3>
    <div id="summaryItems"></div>
    <div id="summaryTotals" style="margin-top:12px"></div>
  </div>
</div>

<footer><div class="container"><div class="copy">© <span data-year></span> <span data-site-name>Store</span> · <a href="privacy.html" style="display:inline">Privacy</a> · <a href="terms.html" style="display:inline">Terms</a> · <a href="refund.html" style="display:inline">Refunds</a></div></div></footer>
<script src="script.js"></script>
</body>
</html>
